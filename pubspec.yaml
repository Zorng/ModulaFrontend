name: modular_pos
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  flutter_riverpod: 3.0.3
  dio: 5.0.0
  http_parser: 4.0.2
  go_router: 14.1.1
  flutter_dotenv: 5.1.0
  shared_preferences: 2.3.4
  equatable: 2.0.5
  image_picker: 1.1.2
  image_picker_for_web: 3.0.5
  geolocator: 10.1.1
  google_maps_flutter: 2.14.2
  google_maps_flutter_web: 0.5.14+3
  web: 0.5.1
  intl: 0.19.0
  uuid: 4.5.2
  qr_flutter: 4.1.0
  flutter_esc_pos_utils: 1.0.1
  flutter_svg: 2.0.17
 
  cupertino_icons: 1.0.8
  drift: 2.19.1+1
  sqlite3: 2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 5.0.0
  mocktail: 1.0.3
  build_runner: 2.4.13
  drift_dev: 2.19.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - 'assets/images/modula.svg'
    - 'assets/images/bakong_logo.png' 

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-ThinItalic.ttf
          weight: 100
          style: italic

        
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
